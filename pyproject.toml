[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "igla"
version = "0.1.0"
description = "IGLA — Iteratively-Generated Local Analysis. Local action runtime with strict policy kernel and LLM planner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Echo-Eins" },
]
keywords = ["agent", "runtime", "llm", "policy", "kernel", "linux"]

dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
igla = "igla.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/igla"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR0911", "PLR0912", "PLR2004", "PLR0915"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src"
